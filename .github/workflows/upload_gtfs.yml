name: Upload GTFS to Google Drive Daily

on:
  schedule:
    - cron: '0 3 * * *'  # iga päev kell 03:00 UTC (Eestis 06:00)
  workflow_dispatch:

jobs:
  upload_gtfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Create service account credentials
        run: |
          mkdir -p ~/.streamlit
          echo "${{ secrets.GOOGLE_SERVICE }}" > ~/.streamlit/secrets.toml

      - name: Run uploader
        run: python .github/scripts/upload_gtfs.py